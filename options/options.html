<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCQ AI Assistant — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0f172a 0%, #1a1040 50%, #0f172a 100%);
      color: #e2e8f0;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 560px; }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .page-header .icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(124,58,237,.4);
    }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    .page-header p  { font-size: 13px; color: #64748b; margin-top: 2px; }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #8b5cf6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    /* ── Form Fields ── */
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field label span { color: #64748b; font-weight: 400; font-size: 12px; }

    .field input[type="text"],
    .field input[type="url"],
    .field input[type="number"],
    .field select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus,
    .field select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,.15);
    }
    .field select option { background: #1e1b4b; }

    /* ── Toggle ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toggle-row:last-child { margin-bottom: 0; }
    .toggle-label { font-size: 13px; color: #94a3b8; }
    .toggle-label small { display: block; font-size: 11px; color: #475569; margin-top: 2px; }
    .toggle {
      position: relative;
      width: 40px; height: 22px;
      cursor: pointer;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.1);
      border-radius: 22px;
      transition: background .3s;
    }
    .toggle .thumb {
      position: absolute;
      left: 3px; top: 3px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .3s;
    }
    .toggle input:checked + .track { background: #7c3aed; }
    .toggle input:checked ~ .thumb { transform: translateX(18px); }

    /* ── Color Picker ── */
    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-row input[type="color"] {
      width: 40px; height: 38px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 2px;
      background: rgba(0,0,0,.3);
      cursor: pointer;
    }
    .color-row .color-hex {
      flex: 1;
    }

    /* ── Connection test ── */
    .conn-row {
      display: flex; gap: 10px; align-items: flex-end;
    }
    .conn-row .field { flex: 1; margin: 0; }
    .btn-test {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(139,92,246,.4);
      background: rgba(139,92,246,.1);
      color: #c4b5fd;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    .btn-test:hover { background: rgba(139,92,246,.25); }
    .conn-result { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .conn-result.ok  { color: #4ade80; }
    .conn-result.err { color: #f87171; }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-save {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 4px 15px rgba(124,58,237,.35);
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,.5); }
    .btn-reset {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: transparent;
      color: #64748b;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-reset:hover { color: #f87171; border-color: rgba(239,68,68,.3); }

    /* ── Save toast ── */
    #save-toast {
      display: none;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      animation: fadeIn .3s;
    }
    #save-toast.ok  { background: rgba(34,197,94,.1); color: #4ade80; border: 1px solid rgba(34,197,94,.2); }
    #save-toast.err { background: rgba(239,68,68,.1); color: #f87171; border: 1px solid rgba(239,68,68,.2); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Page Header -->
    <div class="page-header">
      <div class="icon">🤖</div>
      <div>
        <h1>MCQ AI Assistant</h1>
        <p>Configure your Ollama server and extraction preferences</p>
      </div>
    </div>

    <!-- Ollama Settings -->
    <div class="card">
      <div class="card-title">🔗 Ollama Server</div>

      <div class="conn-row">
        <div class="field">
          <label for="ollama-url">Server Base URL</label>
          <input type="url" id="ollama-url" placeholder="http://localhost:11434" />
        </div>
        <button class="btn-test" id="btn-test-conn">Test</button>
      </div>
      <div class="conn-result" id="conn-result"></div>

      <div class="field" style="margin-top: 16px;">
        <label for="ollama-model">Model Name <span>— e.g. deepseek-coder:6.7b</span></label>
        <input type="text" id="ollama-model" placeholder="deepseek-coder:6.7b" />
      </div>

      <div class="field">
        <label for="req-timeout">Request Timeout <span>— milliseconds</span></label>
        <input type="number" id="req-timeout" min="5000" max="120000" step="1000" />
      </div>

      <div class="field">
        <label for="temperature">Temperature <span>— 0 = deterministic, 1 = creative</span></label>
        <input type="number" id="temperature" min="0" max="1" step="0.05" />
      </div>

      <div class="field">
        <label for="max-tokens">Max Tokens <span>— response length limit</span></label>
        <input type="number" id="max-tokens" min="64" max="2048" step="64" />
      </div>
    </div>

    <!-- Behaviour Settings -->
    <div class="card">
      <div class="card-title">🎛️ Behaviour</div>

      <div class="toggle-row">
        <div class="toggle-label">
          Highlight Correct Option
          <small>Glows the selected answer in the DOM for 3 seconds</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="highlight-toggle" />
          <div class="track"></div>
          <div class="thumb"></div>
        </label>
      </div>

      <div class="field">
        <label>Highlight Colour</label>
        <div class="color-row">
          <input type="color" id="highlight-color" />
          <input type="text" id="highlight-hex" class="color-hex" maxlength="7" placeholder="#22c55e" />
        </div>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">
          Auto-close Panel
          <small>Dismiss the floating result panel automatically after 8s</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="autoclose-toggle" />
          <div class="track"></div>
          <div class="thumb"></div>
        </label>
      </div>
    </div>

    <!-- Extraction Strategy Order -->
    <div class="card">
      <div class="card-title">🔍 Extraction Strategy</div>
      <div class="field">
        <label for="strategy-select">Primary Strategy <span>— fallback chain is always active</span></label>
        <select id="strategy-select">
          <option value="dataAttributes">Data Attributes (data-question / data-option)</option>
          <option value="ariaLabels">ARIA Labels (role="radio", fieldset/legend)</option>
          <option value="semanticHTML">Semantic HTML (fieldset, label, input)</option>
          <option value="classNameHeuristics">Class Heuristics (.question, .option, .choice…)</option>
          <option value="genericHeuristics">Generic Heuristics (fallback — longest paragraph)</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-save" id="btn-save">💾 Save Settings</button>
      <button class="btn-reset" id="btn-reset">Reset</button>
    </div>
    <div id="save-toast"></div>

  </div>

  <script src="options.js"></script>
</body>
</html>
