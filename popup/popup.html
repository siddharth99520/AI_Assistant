<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 100%);
      color: #e2e8f0;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      min-height: 200px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      background: linear-gradient(90deg, rgba(139,92,246,.25), rgba(59,130,246,.15));
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .header-icon { font-size: 22px; }
    .header-info h1 { font-size: 14px; font-weight: 700; color: #c4b5fd; }
    .header-info p  { font-size: 11px; color: #64748b; margin-top: 1px; }

    /* ── Status badge ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #334155;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .status-label { font-size: 12px; color: #94a3b8; }
    .status-label span { color: #e2e8f0; font-weight: 500; }
    .btn-refresh {
      margin-left: auto;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-refresh:hover { background: rgba(139,92,246,.2); color: #c4b5fd; }

    /* ── Body ── */
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Buttons ── */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 4px 15px rgba(124,58,237,.35);
    }
    .btn-primary:hover  { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: #94a3b8;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }

    /* ── Loading state ── */
    .btn-primary .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-label::after { content: "…"; }

    /* ── Info line ── */
    .info-line {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #475569;
      padding: 6px 10px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 8px;
    }
    .info-line .icon { font-size: 13px; }

    /* ── Result toast (shown after analysis) ── */
    #result-toast {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(34,197,94,.3);
      background: rgba(34,197,94,.1);
      font-size: 12px;
      color: #4ade80;
      font-weight: 500;
      animation: fadeIn .3s ease;
    }
    #result-toast.error {
      border-color: rgba(239,68,68,.3);
      background: rgba(239,68,68,.1);
      color: #f87171;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,.05);
    }
    .footer a {
      font-size: 11px; color: #475569; text-decoration: none;
      transition: color .2s;
    }
    .footer a:hover { color: #c4b5fd; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-info">
      <h1>MCQ AI Assistant</h1>
      <p>Powered by DeepSeek via Ollama</p>
    </div>
  </div>

  <!-- Ollama Status -->
  <div class="status-row">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-label">Ollama: <span id="status-text">Checking…</span></span>
    <button class="btn-refresh" id="btn-refresh">↻ Refresh</button>
  </div>

  <!-- Main Actions -->
  <div class="body">
    <button class="btn-primary" id="btn-analyse" disabled>
      <div class="spinner"></div>
      <span class="btn-label">✨ Analyse This MCQ</span>
    </button>

    <div class="info-line">
      <span class="icon">💡</span>
      <span>Extracts the current question from the page and auto-selects the answer.</span>
    </div>

    <div id="result-toast"></div>

    <button class="btn-secondary" id="btn-options">⚙️ Settings</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="footer-model">Model: loading…</a>
    <a href="#" id="footer-url">localhost:11434</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
